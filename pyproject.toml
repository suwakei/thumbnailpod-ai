[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thumbnailai-ai-service"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",

    # AWS
    "aioboto3>=13.0",

    # Database
    "asyncpg>=0.30",
    "alembic>=1.13",
    "sqlalchemy>=2.0",

    # HTTP client
    "httpx>=0.27",

    # OpenAI (DALL-E 3)
    "openai>=1.50",

    # Image processing
    "Pillow>=11.0",
    "numpy>=1.26",

    # ML / AI (heavy deps - optional for API-only service)
    "torch>=2.5",
    "diffusers>=0.31",
    "transformers>=4.46",
    "peft>=0.13",
    "accelerate>=1.1",

    # Style analysis
    "scikit-learn>=1.5",

    # PSD generation (Phase 2)
    "psd-tools>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "PLC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
