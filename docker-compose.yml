services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AWS_REGION=ap-northeast-1
      - S3_BUCKET=thumbnailai-dev
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/thumbnailai-dev
      - DATABASE_URL=postgresql://thumbnailai:thumbnailai@postgres:5432/thumbnailai
      - INTERNAL_API_SECRET=dev-secret
      # Use LocalStack endpoints
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - ENV=development
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AWS_REGION=ap-northeast-1
      - S3_BUCKET=thumbnailai-dev
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/thumbnailai-dev
      - DATABASE_URL=postgresql://thumbnailai:thumbnailai@postgres:5432/thumbnailai
      - INTERNAL_API_SECRET=dev-secret
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    volumes:
      - .:/app

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: thumbnailai
      POSTGRES_PASSWORD: thumbnailai
      POSTGRES_DB: thumbnailai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thumbnailai"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs
      - DEFAULT_REGION=ap-northeast-1
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  localstack_data:
