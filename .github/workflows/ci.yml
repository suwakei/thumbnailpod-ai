name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: thumbnailai
          POSTGRES_PASSWORD: thumbnailai
          POSTGRES_DB: thumbnailai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://thumbnailai:thumbnailai@localhost:5432/thumbnailai
        run: alembic upgrade head

      - name: Run tests
        env:
          ENV: test
          INTERNAL_API_SECRET: test-secret
          OPENAI_API_KEY: sk-test
          DATABASE_URL: postgresql://thumbnailai:thumbnailai@localhost:5432/thumbnailai
          S3_BUCKET: test-bucket
          SQS_QUEUE_URL: http://localhost:4566/test/queue
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: ap-northeast-1
        run: pytest tests/ -v --tb=short

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t thumbnailai-api:${{ github.sha }} -f Dockerfile .

      - name: Build Worker image
        run: docker build -t thumbnailai-worker:${{ github.sha }} -f Dockerfile.worker .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/thumbnailai-ai-service:$IMAGE_TAG -f Dockerfile .
          docker push $ECR_REGISTRY/thumbnailai-ai-service:$IMAGE_TAG

      - name: Build and push Worker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/thumbnailai-ai-worker:$IMAGE_TAG -f Dockerfile.worker .
          docker push $ECR_REGISTRY/thumbnailai-ai-worker:$IMAGE_TAG

      - name: Run DB migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pip install uv
          uv pip install --system alembic asyncpg
          alembic upgrade head

      - name: Deploy AI Service to ECS
        run: |
          aws ecs update-service \
            --cluster thumbnailai-prod \
            --service thumbnailai-ai-service \
            --force-new-deployment

      - name: Deploy AI Worker to ECS
        run: |
          aws ecs update-service \
            --cluster thumbnailai-prod \
            --service thumbnailai-ai-worker \
            --force-new-deployment
