openapi: "3.1.0"
info:
  title: ThumbnailPod AI Service
  description: |
    内部専用 AI サービス API。thumbnailpod-back (Go) からのみ呼び出される。
    VPC 内部の ECS Fargate (GPU) 上で動作し、画像生成・スタイル分析・セグメンテーション・編集・PSD ビルドを提供する。
  version: "1.0.0"

servers:
  - url: http://ai-service.internal
    description: VPC 内部 (Service Discovery / Internal ALB)

security:
  - InternalSecret: []

paths:
  /health:
    get:
      summary: ヘルスチェック
      description: サービスの死活確認。認証不要。
      operationId: health
      security: []
      tags: [System]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /internal/generate:
    post:
      summary: サムネイル画像生成
      description: |
        DALL-E 3 または Stable Diffusion XL でサムネイル画像を生成し、S3 にアップロードする。
        engine フィールドで生成エンジンを切り替える。
      operationId: generateThumbnail
      tags: [Generation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequest"
      responses:
        "200":
          description: 生成成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /internal/style/analyze:
    post:
      summary: スタイル分析
      description: |
        画像 URL のリストを受け取り、CLIP による特徴抽出・色パレット抽出・構図分析を行う。
      operationId: analyzeStyle
      tags: [Style]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StyleAnalyzeRequest"
      responses:
        "200":
          description: 分析成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StyleAnalyzeResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /internal/style/train:
    post:
      summary: スタイル学習ジョブキューイング
      description: |
        LoRA / ControlNet スタイル学習ジョブを SQS にキューイングする。
        実際の学習は AI Worker が非同期で実行する。
      operationId: trainStyle
      tags: [Style]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StyleTrainRequest"
      responses:
        "200":
          description: ジョブキューイング成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StyleTrainResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /internal/segment:
    post:
      summary: 画像セグメンテーション (SAM)
      description: |
        Segment Anything Model (SAM) を使って画像をレイヤーに分離する。
        各レイヤー (background, person, text_region) を PNG で S3 にアップロードする。
      operationId: segmentImage
      tags: [Segment]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SegmentRequest"
      responses:
        "200":
          description: セグメンテーション成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegmentResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /internal/edit:
    post:
      summary: レイヤー編集・再合成
      description: |
        編集オペレーション (text_change, color_adjust, move) を指定レイヤーに適用し、
        変更されたレイヤーのみ再生成して composite を再合成する。
        変更のないレイヤーは unchanged_layers で返す。
      operationId: editThumbnail
      tags: [Edit]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditRequest"
      responses:
        "200":
          description: 編集成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /internal/psd:
    post:
      summary: PSD ファイルビルド
      description: |
        セグメンテーション済みレイヤーから Photoshop (PSD) ファイルを生成し、S3 にアップロードする。
      operationId: buildPsd
      tags: [PSD]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PSDBuildRequest"
      responses:
        "200":
          description: PSD ビルド成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PSDBuildResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /internal/jobs/{job_id}:
    get:
      summary: ジョブステータス取得
      description: |
        generation_jobs テーブルからジョブの状態を取得する。
      operationId: getJob
      tags: [Jobs]
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ジョブ ID
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatusResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: ジョブが存在しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Job not found
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          description: データベース接続不可
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Database unavailable

components:
  securitySchemes:
    InternalSecret:
      type: apiKey
      in: header
      name: X-Internal-Secret
      description: Go バックエンドと共有する内部シークレット

  schemas:
    # --- Generate ---
    GenerationEngine:
      type: string
      enum: [dalle3, sdxl]
      default: dalle3

    GenerateRequest:
      type: object
      required: [job_id, user_id, prompt]
      properties:
        job_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        prompt:
          type: string
          minLength: 1
          maxLength: 2000
        engine:
          $ref: "#/components/schemas/GenerationEngine"
        style_model_id:
          type: string
          format: uuid
          nullable: true
        negative_prompt:
          type: string
          nullable: true
        width:
          type: integer
          default: 1280
        height:
          type: integer
          default: 720

    GenerateResponse:
      type: object
      required: [job_id, s3_key, width, height]
      properties:
        job_id:
          type: string
          format: uuid
        s3_key:
          type: string
        width:
          type: integer
        height:
          type: integer

    # --- Style ---
    StyleMetadata:
      type: object
      properties:
        color_palette:
          type: array
          items:
            type: string
          description: Dominant hex colors
        composition_features:
          type: object
        clip_embedding:
          type: array
          items:
            type: number

    StyleAnalyzeRequest:
      type: object
      required: [user_id, image_urls]
      properties:
        user_id:
          type: string
          format: uuid
        image_urls:
          type: array
          items:
            type: string
            format: uri
          minItems: 1
          maxItems: 50

    StyleAnalyzeResponse:
      type: object
      required: [style_metadata]
      properties:
        style_metadata:
          $ref: "#/components/schemas/StyleMetadata"

    TrainPhase:
      type: string
      enum: [style_ref, lora]
      default: style_ref

    StyleTrainRequest:
      type: object
      required: [style_model_id, user_id, image_urls]
      properties:
        style_model_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        image_urls:
          type: array
          items:
            type: string
            format: uri
          minItems: 10
          maxItems: 100
        phase:
          $ref: "#/components/schemas/TrainPhase"

    StyleTrainResponse:
      type: object
      required: [style_model_id, job_id, phase]
      properties:
        style_model_id:
          type: string
          format: uuid
        job_id:
          type: string
        phase:
          $ref: "#/components/schemas/TrainPhase"

    # --- Segment ---
    SegmentRequest:
      type: object
      required: [job_id, image_url]
      properties:
        job_id:
          type: string
          format: uuid
        image_url:
          type: string
          format: uri

    Layer:
      type: object
      required: [label, s3_key]
      properties:
        label:
          type: string
        s3_key:
          type: string

    SegmentResponse:
      type: object
      required: [job_id, layers]
      properties:
        job_id:
          type: string
          format: uuid
        layers:
          type: array
          items:
            $ref: "#/components/schemas/Layer"
        psd_s3_key:
          type: string
          nullable: true

    # --- Edit ---
    EditOperationType:
      type: string
      enum: [text_change, color_adjust, move]

    Position:
      type: object
      required: [x, y]
      properties:
        x:
          type: integer
        y:
          type: integer

    EditOperation:
      type: object
      required: [type, layer]
      properties:
        type:
          $ref: "#/components/schemas/EditOperationType"
        layer:
          type: string
        content:
          type: string
          nullable: true
        position:
          $ref: "#/components/schemas/Position"
        brightness:
          type: number
          nullable: true
        contrast:
          type: number
          nullable: true
        saturation:
          type: number
          nullable: true

    EditRequest:
      type: object
      required: [job_id, user_id, original_layers, operations]
      properties:
        job_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        original_layers:
          type: object
          additionalProperties:
            type: string
          description: "label -> s3_key mapping"
        operations:
          type: array
          items:
            $ref: "#/components/schemas/EditOperation"
          minItems: 1

    EditResponse:
      type: object
      required: [job_id, layers, unchanged_layers]
      properties:
        job_id:
          type: string
          format: uuid
        layers:
          type: object
          additionalProperties:
            type: string
          description: "Updated layers: label -> s3_key"
        unchanged_layers:
          type: array
          items:
            type: string

    # --- PSD ---
    LayerInput:
      type: object
      required: [label, s3_key]
      properties:
        label:
          type: string
        s3_key:
          type: string

    PSDBuildRequest:
      type: object
      required: [job_id, user_id, base_image_url, layers]
      properties:
        job_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        base_image_url:
          type: string
          format: uri
        layers:
          type: array
          items:
            $ref: "#/components/schemas/LayerInput"

    PSDBuildResponse:
      type: object
      required: [job_id, psd_s3_key]
      properties:
        job_id:
          type: string
          format: uuid
        psd_s3_key:
          type: string

    # --- Jobs ---
    JobStatus:
      type: string
      enum: [pending, processing, completed, failed]

    JobStatusResponse:
      type: object
      required: [job_id, status]
      properties:
        job_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/JobStatus"
        result:
          type: object
          nullable: true
        error_message:
          type: string
          nullable: true

    # --- Error ---
    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string

  responses:
    Forbidden:
      description: 認証失敗 (X-Internal-Secret 不一致)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            detail: Forbidden

    ValidationError:
      description: バリデーションエラー (Pydantic 自動処理)
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: array
                items:
                  type: object
                  properties:
                    loc:
                      type: array
                      items:
                        type: string
                    msg:
                      type: string
                    type:
                      type: string

    InternalError:
      description: サーバー内部エラー
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            generation_failed:
              value:
                detail: Image generation failed
            storage_failed:
              value:
                detail: Storage upload failed
            download_failed:
              value:
                detail: Image download failed
